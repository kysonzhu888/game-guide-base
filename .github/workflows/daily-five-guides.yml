name: Daily five verified guides

on:
  schedule:
    - cron: "17 3 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      mode:
        description: Run preflight, full, deploy resume, or the July 14 evidence repair
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - full
          - resume
          - repair-2026-07-14

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: game-guide-base-daily-five
  cancel-in-progress: false

jobs:
  daily-guides:
    name: Play, verify, and deploy five guides
    runs-on: [self-hosted, macOS, ARM64, game-guide-base]
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      LINEAR_PARENT_ISSUE: UCH-41
      LINEAR_FAILURE_ISSUE: UCH-125
      RUN_MODE: ${{ github.event_name == 'schedule' && 'full' || inputs.mode }}
      TARGET_GUIDES: "5"
      CODEX_BIN: /Applications/ChatGPT.app/Contents/Resources/codex
      CODEX_SIGNED_NODE_BIN: /Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node
      CODEX_MODEL: ${{ vars.GAME_GUIDE_CODEX_MODEL || 'gpt-5.4-mini' }}
      CODEX_QUOTA_TIMEOUT_SECONDS: "90"
      CODEX_PREFLIGHT_TIMEOUT_SECONDS: "180"
      CODEX_AGENT_TIMEOUT_SECONDS: "13800"
      CODEX_REPAIR_TIMEOUT_SECONDS: "7200"
      PAGES_DEPLOY_TIMEOUT_SECONDS: "600"
      PRODUCTION_VERIFY_RETRIES: "18"
      PRODUCTION_VERIFY_RETRY_DELAY_SECONDS: "5"
      PRODUCTION_VERIFY_RETRY_MAX_SECONDS: "120"
      WRANGLER_SEND_METRICS: "false"
      BROWSER_CLIENT_MJS: /Users/kyson/.codex/plugins/cache/openai-bundled/chrome/latest/scripts/browser-client.mjs
      REPAIR_BEFORE_REF: e712d46290e5a4de2c48937a65cf64b9c0cb13f9
      REPAIR_AFTER_REF: 9c8875f22b27f474793ed211d4180c5509c11f9a

    steps:
      - name: Check out the production branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 2

      - name: Add trusted host tools to PATH
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Resolve the run mode and capture the immutable daily baseline
        id: run_context
        shell: bash
        run: |
          set -euo pipefail
          run_date="$(TZ=Asia/Shanghai date +%F)"
          baseline_sha="$(git rev-parse origin/main)"
          evidence_dir="$RUNNER_TEMP/game-guide-evidence/$run_date"
          effective_mode="$RUN_MODE"
          if test "$effective_mode" = "full" \
            && test -s "data/daily-runs/$run_date.json"; then
            effective_mode="resume"
          fi
          mkdir -p "$evidence_dir"
          {
            echo "DAILY_RUN_DATE=$run_date"
            echo "BASELINE_SHA=$baseline_sha"
            echo "DAILY_EVIDENCE_DIR=$evidence_dir"
            echo "GITHUB_RUN_URL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "RUN_MODE=$effective_mode"
          } >> "$GITHUB_ENV"
          echo "mode=$effective_mode" >> "$GITHUB_OUTPUT"
          echo "Resolved daily run mode: requested=$RUN_MODE effective=$effective_mode"
          git config user.name "game-guide-automation"
          git config user.email "kysonzhu888@gmail.com"

      - name: Gate the local Codex quota
        shell: bash
        run: |
          set -euo pipefail
          test -x "$CODEX_BIN"
          set +e
          printf 'Reply exactly CODEX_QUOTA_OK and do nothing else.\n' \
            | /usr/bin/perl -e 'my $seconds = shift @ARGV; alarm $seconds; exec @ARGV or die $!;' \
              "$CODEX_QUOTA_TIMEOUT_SECONDS" \
              "$CODEX_BIN" -c 'model_reasoning_effort="xhigh"' \
              -a never -s read-only -m "$CODEX_MODEL" -C "$GITHUB_WORKSPACE" \
              exec --ephemeral --output-last-message "$RUNNER_TEMP/codex-quota.md" - \
              >"$RUNNER_TEMP/codex-quota.log" 2>&1
          codex_status=$?
          set -e
          cat "$RUNNER_TEMP/codex-quota.log"
          if test "$codex_status" -eq 0 \
            && grep -Fqx "CODEX_QUOTA_OK" "$RUNNER_TEMP/codex-quota.md"; then
            exit 0
          fi
          if grep -Eqi 'usage limit|credits balance|rate.?limit|insufficient.?quota' \
            "$RUNNER_TEMP/codex-quota.log"; then
            reason="Codex quota is unavailable for $CODEX_MODEL."
          elif test "$codex_status" -eq 142; then
            reason="Codex quota probe timed out after $CODEX_QUOTA_TIMEOUT_SECONDS seconds."
          else
            reason="Codex quota probe exited with status $codex_status without the success marker."
          fi
          printf 'CODEX_QUOTA_FAILED: %s\n' "$reason" > "$RUNNER_TEMP/codex-quota.md"
          echo "::error title=Codex daily-guide gate failed::$reason"
          exit 1

      - name: Verify the trusted Mac prerequisites
        shell: bash
        run: |
          set -euo pipefail
          for command in curl ffmpeg file gh git jq node npm npx; do
            command -v "$command" >/dev/null
          done
          test -x "$CODEX_BIN"
          test -s "$BROWSER_CLIENT_MJS"
          test -s "$HOME/.linear/api_token"
          "$CODEX_BIN" mcp list | tee "$RUNNER_TEMP/codex-mcp.txt"
          grep -E '^node_repl[[:space:]].*enabled' "$RUNNER_TEMP/codex-mcp.txt"
          linear_response="$(curl -sS https://api.linear.app/graphql \
            -H "Authorization: $(tr -d '\r\n' < "$HOME/.linear/api_token")" \
            -H "Content-Type: application/json" \
            --data '{"query":"{ organization { urlKey } teams { nodes { key } } }"}')"
          test "$(jq -r '.data.organization.urlKey' <<< "$linear_response")" = "uchuu"
          jq -e '.data.teams.nodes | any(.key == "UCH")' <<< "$linear_response" >/dev/null
          node tools/check-wrangler-auth.mjs "$RUNNER_TEMP/wrangler-whoami.txt"
          npm test
          npm run build
          node tools/build-deploy.mjs

      - name: Start and diagnose the local browser bridge
        shell: bash
        run: |
          set -euo pipefail
          CHATGPT_BIN="/Applications/ChatGPT.app/Contents/MacOS/ChatGPT"
          CHROME_BIN="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          BROWSER_NODE="$CODEX_SIGNED_NODE_BIN"
          CHROME_PLUGIN="$HOME/.codex/plugins/cache/openai-bundled/chrome/latest"
          test -x "$CHATGPT_BIN"
          test -x "$CHROME_BIN"
          test -x "$BROWSER_NODE"
          test -d "$CHROME_PLUGIN/scripts"
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            /Applications/ChatGPT.app/Contents/Info.plist)"
          plugin_version="$(basename "$(readlink "$CHROME_PLUGIN")")"
          test "$app_version" = "$plugin_version"
          nohup "$CHATGPT_BIN" >/dev/null 2>&1 &
          nohup "$CHROME_BIN" \
            --profile-directory=Default \
            --new-window \
            about:blank >/dev/null 2>&1 &
          sleep 5
          {
            echo "# Chrome host diagnostics"
            echo
            echo "App/plugin version: $app_version"
            for script in \
              chrome-is-running.js \
              installed-browsers.js \
              check-extension-installed.js \
              check-native-host-manifest.js; do
              echo
              echo "## $script"
              "$BROWSER_NODE" "$CHROME_PLUGIN/scripts/$script" --json
            done
            echo
            echo "## native host processes"
            pgrep -fl "ChatGPT for Chrome" || true
          } | tee "$RUNNER_TEMP/browser-host-diagnostics.txt"
          patch_result="$(node tools/patch-browser-client.mjs \
            "$BROWSER_CLIENT_MJS" "$(dirname "$BROWSER_CLIENT_MJS")/browser-client-safe.mjs")"
          safe_browser_client="$(jq -r '.outputPath' <<< "$patch_result")"
          safe_browser_hash="$(jq -r '.sha256' <<< "$patch_result")"
          trusted_hashes="$($CODEX_BIN mcp get node_repl --json \
            | jq -r '.transport.env.NODE_REPL_TRUSTED_BROWSER_CLIENT_SHA256S')"
          test -n "$safe_browser_client"
          test -n "$safe_browser_hash"
          test -n "$trusted_hashes"
          {
            echo "BROWSER_CLIENT_MJS=$safe_browser_client"
            echo "BROWSER_CLIENT_SAFE_MJS=$safe_browser_client"
            echo "CODEX_TRUSTED_BROWSER_CLIENT_SHA256S=$trusted_hashes,$safe_browser_hash"
          } >> "$GITHUB_ENV"

      - name: Gate the local Codex and Chrome runtime
        shell: bash
        run: |
          set -euo pipefail
          rendered_prompt="$RUNNER_TEMP/daily-five-guides-preflight.txt"
          sed "s|__BROWSER_CLIENT_MJS__|$BROWSER_CLIENT_MJS|g" \
            .github/prompts/daily-five-guides-preflight.txt > "$rendered_prompt"
          set +e
          "$CODEX_SIGNED_NODE_BIN" tools/run-with-timeout.mjs \
            "$CODEX_PREFLIGHT_TIMEOUT_SECONDS" \
            "$CODEX_BIN" -c 'model_reasoning_effort="xhigh"' \
            -c "mcp_servers.node_repl.env.NODE_REPL_TRUSTED_BROWSER_CLIENT_SHA256S=\"$CODEX_TRUSTED_BROWSER_CLIENT_SHA256S\"" \
            -a never -s read-only -m "$CODEX_MODEL" -C "$GITHUB_WORKSPACE" \
            exec --ephemeral --output-last-message "$RUNNER_TEMP/codex-preflight.md" \
            - < "$rendered_prompt" >"$RUNNER_TEMP/codex-preflight.log" 2>&1
          codex_status=$?
          set -e
          cat "$RUNNER_TEMP/codex-preflight.log"
          if test "$codex_status" -ne 0 && test ! -s "$RUNNER_TEMP/codex-preflight.md"; then
            if test "$codex_status" -eq 142; then
              printf 'BROWSER_PREFLIGHT_FAILED: Codex browser preflight timed out after %s seconds.\n' \
                "$CODEX_PREFLIGHT_TIMEOUT_SECONDS" > "$RUNNER_TEMP/codex-preflight.md"
            else
              printf 'BROWSER_PREFLIGHT_FAILED: Codex CLI exited with status %s before completing the browser preflight.\n' \
                "$codex_status" > "$RUNNER_TEMP/codex-preflight.md"
            fi
          fi
          if ! grep -Fqx "BROWSER_PREFLIGHT_OK" "$RUNNER_TEMP/codex-preflight.md"; then
            echo "Chrome runtime preflight did not return the success marker." >&2
            cat "$RUNNER_TEMP/codex-preflight.md" >&2
            exit 1
          fi

      - name: Run the evidence-backed daily Codex agent
        if: ${{ steps.run_context.outputs.mode == 'full' }}
        shell: bash
        run: |
          set -euo pipefail
          rendered_prompt="$RUNNER_TEMP/daily-five-guides.md"
          sed "s|__BROWSER_CLIENT_MJS__|$BROWSER_CLIENT_MJS|g" \
            .github/prompts/daily-five-guides.md > "$rendered_prompt"
          "$CODEX_SIGNED_NODE_BIN" tools/run-with-timeout.mjs \
            "$CODEX_AGENT_TIMEOUT_SECONDS" \
            "$CODEX_BIN" -c 'model_reasoning_effort="xhigh"' \
            -c "mcp_servers.node_repl.env.NODE_REPL_TRUSTED_BROWSER_CLIENT_SHA256S=\"$CODEX_TRUSTED_BROWSER_CLIENT_SHA256S\"" \
            -a never -s danger-full-access --search -m "$CODEX_MODEL" \
            -C "$GITHUB_WORKSPACE" \
            --add-dir "$DAILY_EVIDENCE_DIR" \
            --add-dir "$HOME/sekai.app.dir/docs" \
            exec --output-last-message "$RUNNER_TEMP/codex-final.md" \
            - < "$rendered_prompt"

      - name: Repair the 2026-07-14 gameplay evidence
        if: ${{ env.RUN_MODE == 'repair-2026-07-14' }}
        shell: bash
        run: |
          set -euo pipefail
          repair_evidence_dir="$RUNNER_TEMP/game-guide-evidence/repair-2026-07-14"
          stable_evidence_dir="$HOME/sekai.app.dir/docs/20260715/game-guide-base-evidence-repair"
          mkdir -p "$repair_evidence_dir"
          cp -R "$stable_evidence_dir/." "$repair_evidence_dir/"
          test "$(find "$repair_evidence_dir" -type f -name '*.jpg' | wc -l | tr -d ' ')" = "11"
          git fetch origin main --deepen=64
          git cat-file -e "$REPAIR_BEFORE_REF^{commit}"
          git cat-file -e "$REPAIR_AFTER_REF^{commit}"
          {
            echo "REPAIR_EVIDENCE_DIR=$repair_evidence_dir"
            echo "REPAIR_STABLE_EVIDENCE_DIR=$stable_evidence_dir"
          } >> "$GITHUB_ENV"
          rendered_prompt="$RUNNER_TEMP/repair-2026-07-14-evidence.md"
          sed \
            -e "s|__BROWSER_CLIENT_MJS__|$BROWSER_CLIENT_MJS|g" \
            -e "s|__REPAIR_EVIDENCE_DIR__|$repair_evidence_dir|g" \
            -e "s|__REPOSITORY_PATH__|$GITHUB_WORKSPACE|g" \
            .github/prompts/repair-2026-07-14-evidence.md > "$rendered_prompt"
          "$CODEX_SIGNED_NODE_BIN" tools/run-with-timeout.mjs \
            "$CODEX_REPAIR_TIMEOUT_SECONDS" \
            "$CODEX_BIN" -c 'model_reasoning_effort="xhigh"' \
            -c "mcp_servers.node_repl.env.NODE_REPL_TRUSTED_BROWSER_CLIENT_SHA256S=\"$CODEX_TRUSTED_BROWSER_CLIENT_SHA256S\"" \
            -a never -s danger-full-access -m "$CODEX_MODEL" \
            -C "$GITHUB_WORKSPACE" \
            --add-dir "$repair_evidence_dir" \
            --add-dir "$HOME/sekai.app.dir/docs" \
            exec --output-last-message "$RUNNER_TEMP/repair-final.md" \
            - < "$rendered_prompt" 2>&1 | tee "$RUNNER_TEMP/repair-agent.log"

      - name: Verify and archive the repaired evidence
        if: ${{ env.RUN_MODE == 'repair-2026-07-14' }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/verify-daily-guides.mjs \
            --before-ref "$REPAIR_BEFORE_REF" \
            --after-ref "$REPAIR_AFTER_REF" \
            --manifest-ref "$GITHUB_SHA" \
            --date 2026-07-14 \
            --evidence-root "$REPAIR_EVIDENCE_DIR" \
            --expected-count 5 \
            | tee "$RUNNER_TEMP/repair-verification.json"
          mkdir -p "$REPAIR_STABLE_EVIDENCE_DIR"
          cp -R "$REPAIR_EVIDENCE_DIR/." "$REPAIR_STABLE_EVIDENCE_DIR/"
          node tools/verify-daily-guides.mjs \
            --before-ref "$REPAIR_BEFORE_REF" \
            --after-ref "$REPAIR_AFTER_REF" \
            --manifest-ref "$GITHUB_SHA" \
            --date 2026-07-14 \
            --evidence-root "$REPAIR_STABLE_EVIDENCE_DIR" \
            --expected-count 5 \
            | tee "$RUNNER_TEMP/repair-stable-verification.json"

      - name: Verify the generated daily pull request
        if: ${{ steps.run_context.outputs.mode == 'full' }}
        shell: bash
        run: |
          set -euo pipefail
          daily_branch="automation/daily-five-guides-$DAILY_RUN_DATE"
          git fetch origin "$daily_branch" --prune
          node tools/verify-daily-guides.mjs \
            --before-ref "$BASELINE_SHA" \
            --after-ref "origin/$daily_branch" \
            --date "$DAILY_RUN_DATE" \
            --evidence-root "$DAILY_EVIDENCE_DIR" \
            --expected-count "$TARGET_GUIDES" \
            | tee "$RUNNER_TEMP/daily-verification.json"
          pull_requests="$(gh pr list \
            --head "$daily_branch" \
            --base main \
            --state open \
            --limit 2 \
            --json number,url,headRefOid)"
          test "$(jq 'length' <<< "$pull_requests")" -eq 1
          test "$(jq -r '.[0].headRefOid' <<< "$pull_requests")" \
            = "$(git rev-parse "origin/$daily_branch")"
          {
            echo
            echo "## Awaiting user merge"
            echo
            echo "The verified content is ready at $(jq -r '.[0].url' <<< "$pull_requests")."
            echo "Production deployment will resume automatically after that PR is merged."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Load the verified daily run for resume
        if: ${{ steps.run_context.outputs.mode == 'resume' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          git switch --detach origin/main
          run_file="data/daily-runs/$DAILY_RUN_DATE.json"
          test -s "$run_file"
          jq -e \
            --arg date "$DAILY_RUN_DATE" \
            --argjson expected "$TARGET_GUIDES" \
            '.date == $date
              and (.guides | length) == $expected
              and ([.guides[].slug] | length) == $expected
              and ([.guides[].slug] | unique | length) == $expected' \
            "$run_file" >/dev/null
          jq \
            --arg after_ref "$(git rev-parse HEAD)" \
            '{
              verified: true,
              resumed: true,
              date,
              afterRef: $after_ref,
              newGuides: [.guides[].slug],
              evidenceCount: ([.guides[].evidence[]] | length)
            }' "$run_file" | tee "$RUNNER_TEMP/daily-verification.json"
          test "$(jq -r '.newGuides | length' "$RUNNER_TEMP/daily-verification.json")" \
            -eq "$TARGET_GUIDES"

      - name: Build and deploy the verified main branch
        if: ${{ steps.run_context.outputs.mode == 'resume' }}
        shell: bash
        run: |
          set -euo pipefail
          git switch --detach origin/main
          npm test
          npm run build
          node tools/build-deploy.mjs | tee "$RUNNER_TEMP/deploy-package.json"
          "$CODEX_SIGNED_NODE_BIN" tools/run-until-output.mjs \
            "$PAGES_DEPLOY_TIMEOUT_SECONDS" \
            "Deployment complete!" \
            npx --yes wrangler@4.110.0 pages deploy .deploy \
            --project-name game-guide-base \
            --branch main \
            | tee "$RUNNER_TEMP/pages-deployment.log"

      - name: Verify the production site
        if: ${{ steps.run_context.outputs.mode == 'resume' }}
        shell: bash
        run: |
          set -euo pipefail
          verify_url() {
            local url="$1"
            echo "Waiting for production URL: $url"
            curl --fail --silent --show-error \
              --connect-timeout 10 \
              --max-time 20 \
              --retry "$PRODUCTION_VERIFY_RETRIES" \
              --retry-delay "$PRODUCTION_VERIFY_RETRY_DELAY_SECONDS" \
              --retry-max-time "$PRODUCTION_VERIFY_RETRY_MAX_SECONDS" \
              --retry-all-errors \
              "$url" >/dev/null
            echo "Verified production URL: $url"
          }
          verify_url https://gameguidebase.com/sitemap.xml
          jq -r '.newGuides[]' "$RUNNER_TEMP/daily-verification.json" | while read -r slug; do
            verify_url "https://gameguidebase.com/games/$slug/?run=$GITHUB_RUN_ID"
          done

      - name: Publish the run summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Game Guide Base daily pipeline"
            echo
            echo "- Mode: $RUN_MODE"
            echo "- Date: ${DAILY_RUN_DATE:-unknown}"
            echo "- Baseline: ${BASELINE_SHA:-unknown}"
            echo "- Target: $TARGET_GUIDES verified new guides"
            echo "- Codex: $CODEX_MODEL via $CODEX_BIN"
            for report in \
              "$RUNNER_TEMP/codex-quota.md" \
              "$RUNNER_TEMP/codex-quota.log" \
              "$RUNNER_TEMP/codex-preflight.md" \
              "$RUNNER_TEMP/codex-preflight.log" \
              "$RUNNER_TEMP/codex-final.md" \
              "$RUNNER_TEMP/repair-final.md" \
              "$RUNNER_TEMP/repair-agent.log" \
              "$RUNNER_TEMP/repair-verification.json" \
              "$RUNNER_TEMP/repair-stable-verification.json" \
              "$RUNNER_TEMP/browser-host-diagnostics.txt" \
              "$RUNNER_TEMP/daily-verification.json" \
              "$RUNNER_TEMP/deploy-package.json" \
              "$RUNNER_TEMP/pages-deployment.log"; do
              if test -f "$report"; then
                echo
                echo "## $(basename "$report")"
                echo
                cat "$report"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          if test -n "${BROWSER_CLIENT_SAFE_MJS:-}"; then
            rm -f -- "$BROWSER_CLIENT_SAFE_MJS"
          fi

      - name: Upload gameplay and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-guide-daily-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/game-guide-evidence
            ${{ runner.temp }}/codex-quota.md
            ${{ runner.temp }}/codex-quota.log
            ${{ runner.temp }}/codex-preflight.md
            ${{ runner.temp }}/codex-preflight.log
            ${{ runner.temp }}/codex-final.md
            ${{ runner.temp }}/repair-final.md
            ${{ runner.temp }}/repair-agent.log
            ${{ runner.temp }}/repair-verification.json
            ${{ runner.temp }}/repair-stable-verification.json
            ${{ runner.temp }}/browser-host-diagnostics.txt
            ${{ runner.temp }}/daily-verification.json
            ${{ runner.temp }}/deploy-package.json
            ${{ runner.temp }}/pages-deployment.log
            ${{ runner.temp }}/codex-mcp.txt
            ${{ runner.temp }}/wrangler-whoami.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Alert the failed daily run
        if: ${{ failure() }}
        continue-on-error: true
        env:
          FAILURE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if test "$RUN_MODE" = "repair-2026-07-14"; then
            export LINEAR_FAILURE_ISSUE=UCH-133
          fi
          node tools/report-daily-failure.mjs
          /usr/bin/osascript -e 'display notification "GameGuideBase daily pipeline failed" with title "Uchuu 自动化异常"'
